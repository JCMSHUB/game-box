<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数独 Sudoku</title>
  <script src="../shared/theme.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="topbar">
      <h1>数独</h1>
      <div class="controls">
        <div class="difficulty" id="difficulty" role="group" aria-label="难度选择">
          <button class="diff-btn active" data-difficulty="easy">简单</button>
          <button class="diff-btn" data-difficulty="medium">中等</button>
          <button class="diff-btn" data-difficulty="hard">困难</button>
        </div>
        <button id="newGame" class="primary">新游戏</button>
        <div class="timer" id="timer">00:00</div>
        <button id="statsBtn" class="theme-btn" title="查看通关战绩">战绩</button>
        <button id="themeBtn" class="theme-btn" title="切换深浅色主题" aria-label="切换深浅色主题">🌙</button>
      </div>
    </header>

    <div class="board" id="board" role="grid" aria-label="数独棋盘">
      <div class="pause-mask hidden" id="pauseMask">
        <p>⏸ 已暂停</p>
        <button id="resume" class="primary">继续</button>
      </div>
    </div>

    <div class="toolbar">
      <button id="undoBtn" class="tool" title="撤销（Ctrl/⌘+Z）">撤销</button>
      <button id="redoBtn" class="tool" title="重做（Ctrl/⌘+Shift+Z）">重做</button>
      <button id="hintBtn" class="tool" title="揭示一格正确答案（H）">提示</button>
      <button id="notesBtn" class="tool" title="铅笔笔记模式开关（N）">笔记</button>
      <button id="pauseBtn" class="tool" title="暂停计时并遮住棋盘（P）">暂停</button>
    </div>

    <div class="numpad" id="numpad">
      <button class="num" data-num="1">1<span class="left"></span></button>
      <button class="num" data-num="2">2<span class="left"></span></button>
      <button class="num" data-num="3">3<span class="left"></span></button>
      <button class="num" data-num="4">4<span class="left"></span></button>
      <button class="num" data-num="5">5<span class="left"></span></button>
      <button class="num" data-num="6">6<span class="left"></span></button>
      <button class="num" data-num="7">7<span class="left"></span></button>
      <button class="num" data-num="8">8<span class="left"></span></button>
      <button class="num" data-num="9">9<span class="left"></span></button>
      <button class="num erase" data-num="0" aria-label="擦除">擦除</button>
    </div>

    <p class="hint">点击选格，键盘 1–9 填数，Backspace 擦除，方向键移动；笔记模式（N）下按数字记铅笔小字；H 提示一格，P 暂停，Ctrl/⌘+Z 撤销；数字键下方是剩余个数，集齐后置灰；行/列/宫填满且全部正确时会绿底标出；进度自动保存，刷新页面接着玩；切换难度开新局。</p>
  </main>

  <div class="overlay hidden" id="confirmOverlay">
    <div class="card">
      <h2>请确认</h2>
      <p id="confirmText">当前进度将被清除</p>
      <div class="confirm-btns">
        <button id="confirmCancel">取消</button>
        <button id="confirmOk" class="primary">确定</button>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="statsOverlay">
    <div class="card stats-card">
      <h2>📊 战绩</h2>
      <div id="statsContent"></div>
      <div class="confirm-btns">
        <button id="statsClear">清空战绩</button>
        <button id="statsClose" class="primary">关闭</button>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="overlay">
    <div class="card">
      <h2>🎉 通关成功</h2>
      <p id="overlayText">用时 00:00</p>
      <button class="primary" id="again">再来一局</button>
    </div>
  </div>

  <script src="sudoku.js"></script>
  <script src="app.js"></script>
</body>
</html>
