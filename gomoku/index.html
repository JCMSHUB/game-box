<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>五子棋 Gomoku</title>
  <script src="../shared/theme.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="topbar">
      <h1>五子棋</h1>
      <div class="controls">
        <div class="difficulty" id="modeGroup" role="group" aria-label="对战模式选择">
          <button class="diff-btn active" data-mode="pve">人机</button>
          <button class="diff-btn" data-mode="pvp">双人</button>
        </div>
        <div class="difficulty" id="diffGroup" role="group" aria-label="AI 难度选择">
          <button class="diff-btn" data-difficulty="easy">简单</button>
          <button class="diff-btn active" data-difficulty="medium">中等</button>
          <button class="diff-btn" data-difficulty="hard">困难</button>
        </div>
        <button id="newGame" class="primary">新游戏</button>
        <div class="timer" id="timer">00:00</div>
        <button id="statsBtn" class="theme-btn" title="查看对局战绩">战绩</button>
        <button id="themeBtn" class="theme-btn" title="切换深浅色主题" aria-label="切换深浅色主题">🌙</button>
      </div>
    </header>

    <div class="status" id="status"></div>

    <div class="board" id="board" role="grid" aria-label="五子棋棋盘"></div>

    <div class="toolbar">
      <button id="undoBtn" class="tool" title="悔棋（Ctrl/⌘+Z）">悔棋</button>
      <button id="redoBtn" class="tool" title="重做（Ctrl/⌘+Shift+Z）">重做</button>
      <button id="hintBtn" class="tool" title="AI 推荐一个好点（H）">提示</button>
    </div>

    <p class="hint">点击空位落子，黑方先行；人机模式你执黑，AI 执白；也可用方向键移动光标、回车落子。悔棋在人机模式一次退两步（含 AI 那手），终局后也可悔棋复盘续下；每局只统计首次结果，复盘续下不重复计入战绩；提示（H）用 AI 推荐一个好点，仅供参考；进度自动保存，刷新接着下；切换模式或难度开新局。</p>
  </main>

  <div class="overlay hidden" id="confirmOverlay">
    <div class="card">
      <h2>请确认</h2>
      <p id="confirmText">当前进度将被清除</p>
      <div class="confirm-btns">
        <button id="confirmCancel">取消</button>
        <button id="confirmOk" class="primary">确定</button>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="statsOverlay">
    <div class="card stats-card">
      <h2>📊 战绩</h2>
      <div id="statsContent"></div>
      <div class="confirm-btns">
        <button id="statsClear">清空战绩</button>
        <button id="statsClose" class="primary">关闭</button>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="overlay">
    <div class="card">
      <h2 id="overlayTitle">🎉 黑方获胜</h2>
      <p id="overlayText">用时 00:00</p>
      <div class="confirm-btns">
        <button id="review">回顾棋局</button>
        <button class="primary" id="again">再来一局</button>
      </div>
    </div>
  </div>

  <script src="gomoku.js"></script>
  <script src="app.js"></script>
</body>
</html>
